// El archivo pendiente ahora guarda el File completo (no solo metadata) hasta que se confirme con "Agregar consentimiento"
async function consHandleFile(file){
  if(!file) return;
  // Guarda el File real para subirlo a IndexedDB al confirmar
  pendingConsFile = file;
  const isImg = file.type && file.type.startsWith('image/');
  const isPdf = file.type === 'application/pdf';
  const icon = isImg ? '🖼️' : (isPdf ? '📄' : '📎');
  let previewHtml = '';
  if(isImg){
    const url = URL.createObjectURL(file);
    previewHtml = `<div style="margin-top:8px;"><img src="${url}" style="max-width:200px;max-height:140px;border-radius:6px;border:1px solid var(--p200);" alt="preview"></div>`;
  }
  document.getElementById('cons-preview').innerHTML = `
    <div style="background:var(--p50);border:1px solid var(--p200);border-radius:8px;padding:10px;display:flex;align-items:flex-start;gap:10px;">
      <span style="font-size:16px;">${icon}</span>
      <div style="flex:1;">
        <div style="font-size:12px;font-weight:500;color:var(--rg-purple);">${file.name}</div>
        <div style="font-size:11px;color:var(--rg-purple-soft);">${(file.size/1024).toFixed(0)} KB · ${file.type||'binario'}</div>
        ${previewHtml}
      </div>
      <button class="btn btn-sm" style="color:var(--r600);" onclick="pendingConsFile=null;document.getElementById('cons-preview').innerHTML='';">Quitar</button>
    </div>`;
}

async function agregarConsent(){
  const tipo = gv('cons-tipo');
  if(!tipo){ alert('Selecciona el tipo de consentimiento'); return; }

  let archivoMeta = null;
  // Si hay un archivo pendiente, lo guardo en IndexedDB y conservo solo la metadata + fileId
  if(pendingConsFile && pendingConsFile.name){
    try{
      const fileId = await idbSaveFile(pendingConsFile, {
        patientId: currentPatient?.id || null,
        patientName: currentPatient?.name || 'Sin paciente',
        module: 'consentimiento',
        consentTipo: tipo
      });
      archivoMeta = {
        fileId,
        name: pendingConsFile.name,
        size: pendingConsFile.size,
        type: pendingConsFile.type
      };
    }catch(err){
      alert('No se pudo guardar el archivo: '+err.message);
      return;
    }
  }

  const item = {
    id:'C'+Date.now(),
    paciente: currentPatient?.name || 'Sin paciente',
    patientId: currentPatient?.id||null,
    tipo,
    desc: gv('cons-desc'),
    fecha: gv('cons-fecha'),
    estado: gv('cons-estado')||'firmado',
    obs: gv('cons-obs'),
    archivo: archivoMeta
  };
  db.consentimientos.unshift(item);
  saveDB();
  ['cons-tipo','cons-desc','cons-fecha','cons-obs'].forEach(id=>{ const e=document.getElementById(id); if(e) e.value=''; });
  document.getElementById('cons-estado').selectedIndex = 0;
  document.getElementById('cons-preview').innerHTML = '';
  pendingConsFile = null;
  renderConsList();
  toast('Consentimiento registrado'+(archivoMeta?' con archivo guardado':''));
}

async function renderConsList(){
  // Filtro por paciente: usa el selector si existe, si no cae en currentPatient
  const filtroSel = document.getElementById('cons-filter-paciente');
  let list;
  if(filtroSel){
    const val = filtroSel.value;
    list = (val === 'all') ? db.consentimientos.slice() : db.consentimientos.filter(c=>c.patientId===val);
  } else {
    list = currentPatient ? db.consentimientos.filter(c=>c.patientId===currentPatient.id) : db.consentimientos.slice();
  }
  // Ordenar por fecha descendente
  list.sort((a,b)=>(b.fecha||'').localeCompare(a.fecha||''));

  const countEl = document.getElementById('cons-count');
  if(countEl) countEl.textContent = list.length+' documentos';
  const el = document.getElementById('cons-display');
  if(!el) return;
  if(!list.length){ el.innerHTML = '<div class="empty-state"><div class="empty-icon">📋</div><p>Sin consentimientos registrados</p></div>'; return; }
  const labels = {firmado:'Firmado',tutor:'Por tutor',pendiente:'Pendiente',rechazado:'Rechazado',revocado:'Revocado'};
  const cls = {firmado:'tag-signed',tutor:'tag-tutor',pendiente:'tag-pending',rechazado:'tag-na',revocado:'tag-na'};

  el.innerHTML = list.map(c=>{
    const isImg = c.archivo?.type && c.archivo.type.startsWith('image/');
    const isPdf = c.archivo?.type === 'application/pdf';
    const fileIcon = isImg ? '🖼️' : (isPdf ? '📄' : '📎');
    const archivoLabel = c.archivo ? `${fileIcon} ${c.archivo.name}` : '';
    const fileButtons = c.archivo?.fileId ? `
      <button class="btn btn-sm" onclick="abrirArchivoGuardado('${c.archivo.fileId}')">↗ Ver archivo</button>
      <button class="btn btn-sm" onclick="descargarArchivoGuardado('${c.archivo.fileId}')">⬇ Descargar</button>
    ` : (c.archivo ? '<span style="font-size:10.5px;color:var(--a800);">⚠ Archivo registrado en versión anterior — sin binario disponible</span>' : '');

    return `
      <div class="doc-card" id="cons-item-${c.id}">
        <div class="doc-icon-sm">📋</div>
        <div class="doc-info">
          <div class="doc-name">${c.tipo}</div>
          <div class="doc-meta-sm">${c.paciente} · ${c.fecha||'sin fecha'}${archivoLabel?' · '+archivoLabel:''}</div>
          ${c.desc?`<div class="doc-prev-sm">${c.desc}</div>`:''}
          ${c.obs?`<div class="doc-prev-sm" style="color:var(--rg-purple-soft);">${c.obs}</div>`:''}
          ${isImg && c.archivo?.fileId ? `<div style="margin-top:8px;"><img id="cons-thumb-${c.id}" style="max-width:200px;max-height:140px;border-radius:6px;border:1px solid var(--p200);cursor:pointer;" onclick="abrirArchivoGuardado('${c.archivo.fileId}')" alt="${c.archivo.name}"></div>` : ''}
          <div style="margin-top:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
            <span class="consent-tag ${cls[c.estado]||'tag-na'}">${labels[c.estado]||c.estado}</span>
            ${fileButtons}
          </div>
        </div>
        <button class="btn btn-sm" style="color:var(--r600);" onclick="eliminarConsent('${c.id}')">Eliminar</button>
      </div>`;
  }).join('');

  // Cargar miniaturas de imágenes guardadas en IndexedDB
  for(const c of list){
    if(c.archivo?.fileId && c.archivo?.type?.startsWith('image/')){
      try{
        const rec = await idbGetFile(c.archivo.fileId);
        if(rec){
          const img = document.getElementById('cons-thumb-'+c.id);
          if(img) img.src = idbObjectURL(rec);
        }
      }catch(e){console.error(e);}
    }
  }
}

// Eliminar consentimiento Y su archivo binario asociado en IndexedDB
async function eliminarConsent(consId){
  if(!confirm('¿Eliminar el consentimiento y su archivo adjunto?')) return;
  const item = db.consentimientos.find(c=>c.id===consId);
  if(item?.archivo?.fileId){
    try{ await idbDeleteFile(item.archivo.fileId); }catch(e){console.error(e);}
  }
  db.consentimientos = db.consentimientos.filter(x=>x.id!==consId);
  saveDB();
  renderConsList();
  toast('Consentimiento eliminado');
}

async function handleWordUpload(file){
  if(!file) return;
  const el = document.getElementById('up-result');

  // Verificación 1: archivo existe y es .docx
  const fileName = (file.name||'').toLowerCase();
  if(!fileName.endsWith('.docx')){
    el.innerHTML = `<div class="ai-panel" style="background:var(--r50);border-color:#F09595;"><div class="ai-body" style="color:var(--r800);"><strong>Formato no soportado:</strong> ${file.name||'archivo'}<br><br>Solo se aceptan archivos .docx (Word moderno). Si tienes un .doc antiguo, ábrelo en Word y guárdalo como .docx (Archivo → Guardar como → Documento de Word).</div></div>`;
    return;
  }

  // Verificación 2: mammoth disponible
  if(typeof mammoth === 'undefined' || !mammoth.extractRawText){
    el.innerHTML = `<div class="ai-panel" style="background:var(--r50);border-color:#F09595;"><div class="ai-body" style="color:var(--r800);"><strong>Librería de lectura no cargada.</strong><br><br>La librería que extrae texto de documentos Word no se cargó. Posibles causas:<ul style="margin:8px 0 0 18px;"><li>Conexión a internet interrumpida (la librería se descarga al abrir la app por primera vez)</li><li>Bloqueador de scripts o firewall</li><li>Modo offline activo</li></ul><br>Recarga la página con conexión activa e intenta de nuevo.</div></div>`;
    return;
  }

  el.innerHTML = `<div class="ai-panel"><div class="ai-hdr"><div class="ai-dot"></div><span class="ai-ttl">Procesando ${file.name}...</span></div><div class="ai-ldr"><div class="ai-d"></div><div class="ai-d"></div><div class="ai-d"></div></div></div>`;

  try{
    // Leer el archivo como arrayBuffer (Promise-based, más confiable)
    const arrayBuffer = await file.arrayBuffer();

    // Extraer texto
    const result = await mammoth.extractRawText({arrayBuffer});
    const text = (result.value||'').trim();

    if(!text){
      el.innerHTML = `<div class="ai-panel" style="background:var(--a50);border-color:#EF9F27;"><div class="ai-body" style="color:var(--a800);"><strong>El documento parece estar vacío</strong> o solo contiene imágenes/tablas que no se pudieron extraer como texto. Verifica el archivo en Word antes de intentar de nuevo.</div></div>`;
      return;
    }

    const ptId = gv('up-paciente');
    const type = gv('up-tipo')||'historia';
    const pt = db.patients.find(p=>p.id===ptId);

    const doc = {
      id:'D'+Date.now(),
      type,
      patientId: ptId||null,
      patientName: pt?.name||'Sin paciente',
      date: new Date().toISOString().slice(0,10),
      data: {imported: text}
    };
    db.documents.push(doc);
    saveDB();

    // Construir vista previa con escape básico de HTML
    const safeText = text.slice(0,500).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');

    el.innerHTML = `
      <div class="ai-panel">
        <div class="ai-hdr"><div class="ai-dot"></div><span class="ai-ttl">✓ Documento importado</span></div>
        <div class="ai-body">
          <strong>Archivo:</strong> ${file.name}<br>
          <strong>Paciente:</strong> ${pt?.name||'Sin asignar'}<br>
          <strong>Tipo:</strong> ${docTypeLabel(type)}<br>
          <strong>Caracteres:</strong> ${text.length}<br><br>
          <strong>Vista previa (primeros 500 caracteres):</strong><br>
          <div style="background:#fff;padding:10px;border-radius:6px;border:1px solid var(--p200);margin-top:6px;font-family:Georgia,serif;font-size:12px;line-height:1.5;color:var(--rg-purple-dark);max-height:200px;overflow-y:auto;">${safeText}${text.length>500?'…':''}</div>
        </div>
        <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;">
          ${pt ? `
            <button class="btn btn-primary btn-sm" onclick="cargarTextoEnModulo('${doc.id}')">↗ Cargar tal cual en ${docTypeLabel(type)}</button>
            <button class="btn btn-ai btn-sm" onclick="reformatearConIA('${doc.id}')">✦ Reformatear con IA y cargar</button>
          ` : '<span style="font-size:11px;color:var(--a800);">Selecciona un paciente arriba para cargar el texto en el módulo</span>'}
          <button class="btn btn-sm" onclick="copyImportedText('${doc.id}')">📋 Copiar texto completo</button>
        </div>
      </div>`;
    toast('Documento importado correctamente');
    document.getElementById('word-input').value = '';
  }catch(err){
    console.error('Error importando Word:', err);
    el.innerHTML = `<div class="ai-panel" style="background:var(--r50);border-color:#F09595;"><div class="ai-body" style="color:var(--r800);"><strong>No se pudo procesar el archivo</strong>: ${err.message||'Error desconocido'}<br><br>Posibles causas:<ul style="margin:8px 0 0 18px;"><li>El archivo está dañado o protegido con contraseña</li><li>El archivo no es realmente un .docx (extensión renombrada)</li><li>El archivo es muy grande (intenta dividirlo)</li></ul></div></div>`;
  }
}

function copyImportedText(docId){
  const doc = db.documents.find(d=>d.id===docId);
  if(!doc) return;
  navigator.clipboard.writeText(doc.data.imported||'').then(()=>{
    toast('Texto copiado al portapapeles');
  }).catch(()=>{
    toast('No se pudo copiar — selecciona y copia manualmente');
  });
}

// Carga el texto importado en el módulo correspondiente
function cargarTextoEnModulo(docId){
  const doc = db.documents.find(d=>d.id===docId);
  if(!doc){ toast('Documento no encontrado'); return; }
  const pt = db.patients.find(p=>p.id===doc.patientId);
  if(!pt){ toast('Selecciona el paciente para continuar'); return; }

  // Selecciona el paciente y muestra el módulo correspondiente
  currentPatient = pt;
  showView(doc.type);

  // Espera a que el DOM se renderice y luego inserta el texto
  setTimeout(()=>{
    const text = doc.data.imported||'';
    const targetByType = {
      historia: 'hc-pa',          // padecimiento actual
      evolucion: 'ev-subj',       // subjetivo
      resumen: 'res-tto',         // tratamientos recibidos (campo más amplio)
      referencia: 'ref-resumen',  // resumen clínico
      receta: 'rx-meds'           // medicamentos
    };
    const targetId = targetByType[doc.type];
    const targetEl = document.getElementById(targetId);
    if(targetEl){
      // Si ya hay contenido, lo concatena con separador; si está vacío, lo pone tal cual
      if(targetEl.value && targetEl.value.trim()){
        targetEl.value += '\n\n--- Importado de '+ (doc.id) +' ---\n' + text;
      } else {
        targetEl.value = text;
      }
      // Scroll al campo y resaltado breve
      targetEl.scrollIntoView({behavior:'smooth', block:'center'});
      targetEl.style.transition = 'background 0.4s';
      targetEl.style.background = 'var(--pk50)';
      setTimeout(()=>{ targetEl.style.background = ''; }, 1800);
      targetEl.focus();
      toast(`Texto cargado en ${docTypeLabel(doc.type)}`);
    } else {
      toast('No se encontró el campo destino — copia el texto manualmente');
    }
  }, 250);
}

// Lee el JSON del portapapeles, lo parsea y distribuye cada campo en el id del DOM
// que le corresponde según FIELD_MAPS.
async function distribuirJSONReformateado(docType, docId){
  let raw = '';
  try{
    raw = await navigator.clipboard.readText();
  }catch(e){
    alert('No se pudo leer el portapapeles. Pega el JSON manualmente: usa Ctrl/Cmd+V en cualquier campo de texto y luego copia el contenido al portapapeles, o usa el botón "Pegar manualmente".');
    return;
  }
  if(!raw || !raw.trim()){
    toast('El portapapeles está vacío. Copia primero la respuesta JSON de Claude.ai');
    return;
  }

  // Limpiar marcadores ``` json y ``` y texto extra antes/después del JSON
  let cleaned = raw.trim();
  // Buscar el primer { y el último } para extraer el JSON puro
  const firstBrace = cleaned.indexOf('{');
  const lastBrace = cleaned.lastIndexOf('}');
  if(firstBrace !== -1 && lastBrace !== -1 && lastBrace > firstBrace){
    cleaned = cleaned.substring(firstBrace, lastBrace+1);
  }

  let parsed;
  try{
    parsed = JSON.parse(cleaned);
  }catch(e){
    alert('No se pudo parsear el JSON. Verifica que copiaste el bloque completo (con las llaves { } abriendo y cerrando).\n\nError: '+e.message+'\n\nContenido recibido (primeros 200 chars):\n'+cleaned.slice(0,200));
    return;
  }

  const fieldMap = FIELD_MAPS[docType] || FIELD_MAPS.evolucion;
  let camposLlenados = 0;
  let camposVacios = 0;
  const aplicados = [];

  Object.entries(fieldMap).forEach(([jsonKey, domId])=>{
    const valor = parsed[jsonKey];
    if(valor !== undefined && valor !== null && String(valor).trim() !== ''){
      const el = document.getElementById(domId);
      if(el){
        // Para selects, intentar match por opción exacta
        if(el.tagName === 'SELECT'){
          const valStr = String(valor).trim();
          let matched = false;
          for(const opt of el.options){
            if(opt.value === valStr || opt.textContent.trim().toLowerCase() === valStr.toLowerCase() ||
               opt.textContent.trim().startsWith(valStr) || valStr.toLowerCase().includes(opt.value.toLowerCase())){
              el.value = opt.value;
              matched = true;
              break;
            }
          }
          if(!matched && valStr) el.value = valStr; // fallback
        } else {
          el.value = String(valor);
        }
        camposLlenados++;
        aplicados.push(jsonKey);
        // Resaltado breve
        el.style.transition = 'background 0.4s';
        el.style.background = 'var(--pk50)';
        setTimeout(()=>{ el.style.background = ''; }, 2500);
      }
    } else {
      camposVacios++;
    }
  });

  // Recalcular IMC y SC si aplica
  if(docType==='evolucion') calcIMC('ev');
  else if(docType==='historia') calcIMC('hc');
  if(docType==='evolucion' && typeof evalSV==='function') evalSV();

  // Quitar la guía y mostrar resumen
  const guia = document.getElementById('reformat-guide');
  if(guia){
    guia.style.borderColor = 'var(--gr200)';
    guia.innerHTML = `
      <div class="ai-hdr">
        <div class="ai-dot" style="background:var(--gr600);"></div>
        <span class="ai-ttl" style="color:var(--gr800);">✓ Distribución completada</span>
      </div>
      <div class="ai-body">
        <p><strong>${camposLlenados}</strong> campos llenados automáticamente. ${camposVacios>0?`<strong>${camposVacios}</strong> campos quedaron vacíos (sin información en la nota original).`:''}</p>
        <p style="font-size:11px;color:var(--rg-purple-soft);margin-top:6px;">Revisa los campos resaltados en rosa, ajusta lo que necesites y presiona <strong>"Guardar"</strong> arriba para almacenar la nota.</p>
        <button class="btn btn-sm" style="margin-top:8px;" onclick="document.getElementById('reformat-guide')?.remove();">Cerrar mensaje</button>
      </div>`;
  }
  toast(`✓ ${camposLlenados} campos distribuidos en ${docTypeLabel(docType)}`);
}

  const sel = document.getElementById('exp-doc');
  sel.innerHTML = '';
  if(!pid){ sel.innerHTML = '<option value="">— Selecciona primero un paciente —</option>'; return; }
  const docs = db.documents.filter(d=>d.patientId===pid)
    .sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  if(!docs.length){ sel.innerHTML = '<option value="">Sin documentos guardados</option>'; return; }
  sel.innerHTML = '<option value="">— Seleccionar documento —</option>' +
    docs.map(d=>{
      const label = TIPO_DOC_LABELS[d.type]?.label || d.type;

        : `${icon} ${label} · ${fecha}`;
      return `<option value="${d.id}">${texto}</option>`;
    }).join('');
}

// Genera el HTML completo de un documento (mismo formato que impresión)
function generarHTMLDocumento(doc){
  const tipo = doc.type;
  // Solo soportamos los tipos imprimibles (no morfología que tiene archivos)
  if(!PRINT_SECTIONS[tipo]) return null;

  const titulo = PRINT_TITLES[tipo] || 'Documento';
  const sections = PRINT_SECTIONS[tipo] || [];
  const fechaDoc = doc.date || 'sin fecha';

  // Datos del paciente desde el doc
  const pt = db.patients.find(p=>p.id===doc.patientId);
  const ptName = pt?.name || doc.patientName || 'Sin paciente';
  const ptAge = pt?.dob ? calcAge(pt.dob)+' años' : '—';
  const ptSex = pt?.sex || '—';
  const ptDx = pt?.dx || '';
  const ptExpediente = pt?.expediente || '';

  // Datos del médico y clínica predeterminados
  const medicos = loadMedicos();
  const clinicas = loadClinicas();
  const sel = loadSeleccion();
  const m = medicos.find(x=>x.id===sel.medicoId) || medicos[0] || {};
  const c = clinicas.find(x=>x.id===sel.clinicaId) || clinicas[0] || {};
  const medNombre = m.nombre || 'Nombre del médico';
  const medCedula = m.cedula || '';
  const medCedulaEsp = m.cedulaEsp || '';
  const medEspecialidad = m.especialidad || '';
  const medSubesp = m.subespecialidad || '';
  const medDireccion = c.direccion || '';
  const medTelefono = c.telefono || '';
  const medEmail = c.email || '';
  const cedulasStr = [
    medCedula ? `Céd. Prof.: ${medCedula}` : '',
    medCedulaEsp ? `Céd. Esp.: ${medCedulaEsp}` : ''
  ].filter(Boolean).join(' · ');

  // Construir secciones desde doc.data
  const data = {...(doc.data || {})};

  // Para hoja de referencia: migra claves viejas con guion_bajo a guion (retrocompatibilidad)
  if(tipo === 'referencia'){
    const migrarClaves = ['orig-nombre','orig-dom','orig-serv','orig-tel','dest-nombre','dest-dom','dest-serv','dest-medico','dest-tel'];
    migrarClaves.forEach(k => {
      const claveVieja = k.replace(/-/g,'_');
      if(!data[k] && data[claveVieja]) data[k] = data[claveVieja];
    });
  }

  // Para historia clínica: inyecta edad y género del paciente si no están en data
  if(tipo === 'historia'){
    if(data.dob && !data.edad){
      const edad = calcAge(data.dob);
      if(edad !== null && edad !== undefined && !isNaN(edad)) data.edad = edad + ' años';
    }
    if(!data.genero && pt?.sex) data.genero = pt.sex;
    // Migración: historias viejas con campo único 'plan' → 'pf' (plan farmacológico)
    if(data.plan && !data.pf) data.pf = data.plan;
  }

  // Para nota de evolución: inyecta Ficha de identificación desde paciente + historia previa
  if(tipo === 'evolucion' && pt){
    data.nombre = pt.name || '';
    data.dob = pt.dob || '';
    data.edad = pt.dob ? (calcAge(pt.dob) + ' años') : '';
    data.genero = pt.sex || '';

    // Migración: tas/tad → ta
    if((data.tas || data.tad) && !data.ta){
      const tas = (data.tas || '').toString().trim();
      const tad = (data.tad || '').toString().trim();
      if(tas && tad) data.ta = tas + '/' + tad;
      else if(tas) data.ta = tas;
      else if(tad) data.ta = tad;
    }

    const historiaPrev = db.documents
      .filter(d => d.type === 'historia' && d.patientId === pt.id)
      .sort((a,b) => (b.date||'').localeCompare(a.date||''))[0];
    if(historiaPrev?.data){
      const hd = historiaPrev.data;
      ['ecivil','escol','ocup','religion','dom','grupo-sang','tipif','alergias'].forEach(k => {
        if(hd[k] && !data[k]) data[k] = hd[k];

  // Claves cuyo label nunca se muestra (texto directo, sin subtítulo)
  const LABELS_OCULTOS_W = new Set(['evol','motivo','subj','ef','addendum','pa','analisis','plan','resumen','labs']);

    const valoresEfectivos = {};

      const raw = (data[k]||'').toString().trim();
      if(raw){
        valoresEfectivos[k] = raw;
      } else if(NEGACIONES_POR_DEFECTO[k]){
        valoresEfectivos[k] = NEGACIONES_POR_DEFECTO[k];
      }
    });
    const camposLlenos = Object.keys(valoresEfectivos);
    if(!camposLlenos.length) return '';
    return camposLlenos.map(k=>{
      let valor = valoresEfectivos[k];
      const label = PRINT_LABELS[k] || k;
      // Campos estructurados breves que SIEMPRE deben mostrarse como cortos (formato inline morado discreto)
      const FORZAR_CORTO = new Set(['orig-nombre','orig-dom','orig-serv','orig-tel','medico','dest-nombre','dest-dom','dest-serv','dest-medico','dest-tel','nombre','dob','sexo','nss','expediente']);
      const esLargo = !FORZAR_CORTO.has(k) && (valor.length > 80 || valor.includes('\n'));

      const unidad = UNIDADES_CAMPOS[k] || '';
      if(unidad && valor && !valor.toLowerCase().includes(unidad.toLowerCase().replace(/[°/²]/g,''))) {

  const seccionesHtml = sections.map(sec=>{

// Genera y descarga un archivo Word (.doc) para un documento individual
function descargarWord(html, nombreArchivo){
  // Usamos formato .doc (HTML embebido) que Word abre nativamente
  const blob = new Blob(['\ufeff', html], {type:'application/msword'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = nombreArchivo;
  document.body.appendChild(a);
  a.click();
  setTimeout(()=>{ document.body.removeChild(a); URL.revokeObjectURL(url); }, 200);
}

// Exportar un documento individual
function exportarDocAWord(){
  const docId = document.getElementById('exp-doc').value;
  if(!docId){ toast('Selecciona un documento'); return; }
  const doc = db.documents.find(d=>d.id===docId);
  if(!doc){ toast('Documento no encontrado'); return; }
  const html = generarHTMLDocumento(doc);
  if(!html){
    toast('Este tipo de documento no se puede exportar a Word (ej: morfología tiene archivos adjuntos)');
    return;
  }
  const tipoLabel = TIPO_DOC_LABELS[doc.type]?.label || doc.type;
  const ptName = (doc.patientName||'paciente').replace(/[^a-zA-Z0-9_-]/g,'_').slice(0,40);
  const fecha = doc.date || new Date().toISOString().slice(0,10);
  const nombre = `RG_${tipoLabel.replace(/\s+/g,'_')}_${ptName}_${fecha}.doc`;
  descargarWord(html, nombre);
  toast(`✓ ${tipoLabel} exportada como Word`);
}

// Exportar TODOS los documentos de un paciente — uno por archivo
async function exportarTodosDocsPaciente(){
  const pid = document.getElementById('exp-paciente-todo').value;
  if(!pid){ toast('Selecciona un paciente'); return; }
  const p = db.patients.find(x=>x.id===pid);
  if(!p){ toast('Paciente no encontrado'); return; }
  const docs = db.documents.filter(d=>d.patientId===pid && PRINT_SECTIONS[d.type]);
  if(!docs.length){ toast('No hay documentos exportables para este paciente'); return; }

  if(!confirm(`Se generarán ${docs.length} archivo${docs.length!==1?'s':''} Word de ${p.name}.\n\nTu navegador puede pedirte permiso para descargas múltiples — acepta para que se descarguen todos.`)) return;

  let exitos = 0;
  for(const doc of docs){
    const html = generarHTMLDocumento(doc);
    if(!html) continue;
    const tipoLabel = TIPO_DOC_LABELS[doc.type]?.label || doc.type;
    const ptName = (p.name||'paciente').replace(/[^a-zA-Z0-9_-]/g,'_').slice(0,40);
    const fecha = doc.date || new Date().toISOString().slice(0,10);
    const nombre = `RG_${tipoLabel.replace(/\s+/g,'_')}_${ptName}_${fecha}.doc`;
    descargarWord(html, nombre);
    exitos++;
    // Pequeña pausa entre descargas para que el navegador las procese
    await new Promise(r=>setTimeout(r, 300));
  }
  toast(`✓ ${exitos} documento${exitos!==1?'s':''} Word generado${exitos!==1?'s':''}`);
}

// ----- Carga / migración -----
function loadMedicos(){
  let arr = JSON.parse(localStorage.getItem(MEDICOS_KEY)||'null');
  if(arr === null){
    // Migración desde la estructura vieja (un solo médico)
    const old = JSON.parse(localStorage.getItem(MEDICO_KEY)||'null');
    if(old && old.nombre){
      const migrado = {
        id: 'M'+Date.now(),
        nombre: old.nombre||'',
        cedula: old.cedula||'',
        cedulaEsp: old.cedulaEsp||'',
        especialidad: old.especialidad||'Hematología',
        subespecialidad: old.subespecialidad||'',
        universidad: old.universidad||'',
        residencia: old.residencia||'',
        extra: old.extra||''
      };
      arr = [migrado];
      localStorage.setItem(MEDICOS_KEY, JSON.stringify(arr));
    } else {
      arr = [];
    }
  }
  return arr;
}
function saveMedicos(arr){ localStorage.setItem(MEDICOS_KEY, JSON.stringify(arr)); }

function loadClinicas(){
  let arr = JSON.parse(localStorage.getItem(CLINICAS_KEY)||'null');
  if(arr === null){
    // Migración: si en el módulo viejo había dirección/teléfono, lo guardo como primera clínica
    const old = JSON.parse(localStorage.getItem(MEDICO_KEY)||'null');
    if(old && (old.direccion || old.telefono || old.email)){
      arr = [{
        id: 'C'+Date.now(),
        nombre: 'Consultorio principal',
        direccion: old.direccion||'',
        telefono: old.telefono||'',

        horario: '',
        notas: ''

      localStorage.setItem(CLINICAS_KEY, JSON.stringify(arr));
    } else {
      arr = [];
    }
  }
  return arr;
}

// Sincronización con Google Drive usando OAuth 2.0 (Google Identity Services).
// Guarda un único archivo JSON con toda la base + binarios codificados en base64.
// El Client ID se configura una sola vez por el usuario en la pantalla de sync.

const DRIVE_CONFIG_KEY = 'rg_drive_config_c2';
const DRIVE_FILE_NAME = 'RG_Hematologia_Consultorio2_Backup.json';
const DRIVE_FOLDER_NAME = 'RG_Hematologia_Consultorio2';
const DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.file'; // solo archivos creados por la app

let driveTokenClient = null;
let driveAccessToken = null;
let driveFileId = null;
let driveFolderId = null;

function driveLoadConfig(){
  return JSON.parse(localStorage.getItem(DRIVE_CONFIG_KEY)||'{}');
}
function driveSaveConfig(cfg){
  localStorage.setItem(DRIVE_CONFIG_KEY, JSON.stringify(cfg));
}

function renderSyncView(){
  const cfg = driveLoadConfig();

  setContent(`

        <button class="btn" onclick="driveMostrarGuia()">📖 Ver guía paso a paso</button>
      </div>

    <div class="card">

          <button class="btn btn-pink" onclick="driveSubir()">⬆ Subir a Drive (sobreescribe)</button>

function driveGuardarClientId(){
  const id = gv('drive-client-id').trim();
  if(!id){ alert('Captura el Client ID'); return; }
  if(!id.includes('.apps.googleusercontent.com')){
    alert('El Client ID debe terminar en ".apps.googleusercontent.com". Verifica que lo copiaste completo.');
    return;
  }
  const cfg = driveLoadConfig();
  cfg.clientId = id;
  driveSaveConfig(cfg);
  toast('Client ID guardado. Ahora presiona "Conectar Google Drive"');
  renderSyncView();
}

function driveDesconectar(){
  driveAccessToken = null;
  driveFileId = null;
  driveFolderId = null;
  const cfg = driveLoadConfig();
  delete cfg.userEmail;
  driveSaveConfig(cfg);
  toast('Desconectado de Google Drive');
  renderSyncView();
}

// Inicializa el flujo OAuth cuando el usuario presiona "Conectar"
function driveConectar(){
  const cfg = driveLoadConfig();
  if(!cfg.clientId){
    alert('Primero captura tu Client ID de Google');
    return;
  }
  if(typeof google === 'undefined' || !google.accounts?.oauth2){
    alert('La librería de Google aún se está cargando. Espera 2-3 segundos e intenta de nuevo.');
    return;
  }

  driveTokenClient = google.accounts.oauth2.initTokenClient({
    client_id: cfg.clientId,
    scope: DRIVE_SCOPE,
    callback: async (resp)=>{
      if(resp.error){
        alert('Error al autenticar: '+resp.error+'\n\n'+(resp.error_description||''));
        return;
      }
      driveAccessToken = resp.access_token;

      // Obtener email del usuario para mostrarlo
      try{
        const r = await fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
          headers: {'Authorization':'Bearer '+driveAccessToken}
        });
        const u = await r.json();
        const cfg2 = driveLoadConfig();
        cfg2.userEmail = u.email||'';
        driveSaveConfig(cfg2);
      }catch(e){console.error(e);}

      toast('✓ Conectado a Google Drive');
      renderSyncView();
    }
  });
  driveTokenClient.requestAccessToken({prompt:'consent'});
}

// Encuentra o crea la carpeta RG_Hematologia en Drive
async function driveGetOrCreateFolder(){
  if(driveFolderId) return driveFolderId;

  // Buscar la carpeta
  const search = await fetch(`https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent("name='"+DRIVE_FOLDER_NAME+"' and mimeType='application/vnd.google-apps.folder' and trashed=false")}&fields=files(id,name)`, {
    headers:{'Authorization':'Bearer '+driveAccessToken}
  });
  const sj = await search.json();
  if(sj.files && sj.files.length){
    driveFolderId = sj.files[0].id;
    return driveFolderId;
  }
  // Crear
  const create = await fetch('https://www.googleapis.com/drive/v3/files', {
    method:'POST',
    headers:{'Authorization':'Bearer '+driveAccessToken,'Content-Type':'application/json'},
    body: JSON.stringify({name:DRIVE_FOLDER_NAME, mimeType:'application/vnd.google-apps.folder'})
  });
  const cj = await create.json();
  driveFolderId = cj.id;
  return driveFolderId;
}

// Encuentra el archivo de respaldo dentro de la carpeta (si existe)
async function driveFindBackupFile(folderId){
  const r = await fetch(`https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent("name='"+DRIVE_FILE_NAME+"' and '"+folderId+"' in parents and trashed=false")}&fields=files(id,name,modifiedTime,size)`, {
    headers:{'Authorization':'Bearer '+driveAccessToken}
  });
  const j = await r.json();
  return j.files && j.files.length ? j.files[0] : null;
}

// Empaqueta toda la base local (db + archivos binarios IndexedDB) en un solo JSON
async function drivePrepararPaquete(){
  const archivos = [];
  try{
    const all = await idbListFiles({});
    for(const f of all){
      // Convertir Blob a base64
      const blob = f.blob;
      if(blob){
        const b64 = await blobABase64(blob);
        archivos.push({
          id: f.id,
          name: f.name,
          type: f.type,
          size: f.size,
          patientId: f.patientId,
          patientName: f.patientName,
          module: f.module,
          consentTipo: f.consentTipo,
          extractedText: f.extractedText,
          created: f.created,
          dataB64: b64
        });
      }
    }
  }catch(e){console.error('Error empaquetando archivos:',e);}

  return {
    version: '1.1',
    timestamp: new Date().toISOString(),
    db: db,
    medicos: loadMedicos(),
    clinicas: loadClinicas(),
    archivos: archivos
  };
}

function blobABase64(blob){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>resolve(reader.result.split(',')[1]); // quitar el prefijo data:...;base64,
    reader.onerror = reject;
    reader.readAsDataURL(blob);
  });
}

function base64ABlob(b64, mimeType){
  const bin = atob(b64);
  const arr = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], {type: mimeType||'application/octet-stream'});
}

  confirmacion += `• ${totalPts} paciente${totalPts!==1?'s':''}\n`;
  confirmacion += `• ${totalDocs} documento${totalDocs!==1?'s':''} clínico${totalDocs!==1?'s':''}\n`;
  confirmacion += `• ${totalCons} consentimiento${totalCons!==1?'s':''}\n`;
  confirmacion += `• ${totalMedicos} médico${totalMedicos!==1?'s':''} registrado${totalMedicos!==1?'s':''}\n`;
  confirmacion += `• ${totalClinicas} consultorio${totalClinicas!==1?'s':''} registrado${totalClinicas!==1?'s':''}\n`;
  confirmacion += `• ${totalArchivos} archivo${totalArchivos!==1?'s':''} binario${totalArchivos!==1?'s':''} (PDFs, imágenes)\n\n`;
  confirmacion += `Última sincronización: ${lastSync} (${lastAction})\n\n`;
  confirmacion += `⚠ Esta acción SOBRESCRIBE el respaldo anterior en Drive.\n\n`;
  confirmacion += `Asegúrate de que estos son los datos más recientes. Si trabajaste en otro dispositivo después de la última sincronización, primero deberías "⬇ Bajar de Drive" en este dispositivo o subir desde el dispositivo más actualizado.`;

  if(!confirm(confirmacion)) return;

  const el = document.getElementById('drive-result');
  el.innerHTML = `<div class="ai-panel"><div class="ai-hdr"><div class="ai-dot"></div><span class="ai-ttl">Empaquetando datos...</span></div><div class="ai-ldr"><div class="ai-d"></div><div class="ai-d"></div><div class="ai-d"></div></div></div>`;

  try{
    const folderId = await driveGetOrCreateFolder();
    const paquete = await drivePrepararPaquete();
    const json = JSON.stringify(paquete);
    const sizeMB = (json.length/1048576).toFixed(2);

    el.innerHTML = `<div class="ai-panel"><div class="ai-hdr"><div class="ai-dot"></div><span class="ai-ttl">Subiendo ${sizeMB} MB a Google Drive...</span></div><div class="ai-ldr"><div class="ai-d"></div><div class="ai-d"></div><div class="ai-d"></div></div></div>`;

    const existing = await driveFindBackupFile(folderId);
    const blob = new Blob([json], {type:'application/json'});

    let endpoint, method;
    if(existing){
      endpoint = `https://www.googleapis.com/upload/drive/v3/files/${existing.id}?uploadType=media`;
      method = 'PATCH';
    } else {
      // Subida con multipart para incluir metadata (nombre + carpeta)
      endpoint = 'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart';
      method = 'POST';
    }

    let body, headers;
    if(existing){
      headers = {'Authorization':'Bearer '+driveAccessToken,'Content-Type':'application/json'};
      body = json;
    } else {
      const boundary = '-------rg-boundary-'+Date.now();
      const metadata = {name:DRIVE_FILE_NAME, parents:[folderId]};
      const multipartBody =
        `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n` +
        `--${boundary}\r\nContent-Type: application/json\r\n\r\n${json}\r\n` +
        `--${boundary}--`;
      headers = {'Authorization':'Bearer '+driveAccessToken,'Content-Type':'multipart/related; boundary='+boundary};
      body = multipartBody;
    }

    const resp = await fetch(endpoint, {method, headers, body});
    if(!resp.ok){
      const err = await resp.text();
      throw new Error(`HTTP ${resp.status}: ${err.slice(0,200)}`);
    }
    const result = await resp.json();
    driveFileId = result.id;

    const cfg = driveLoadConfig();
    cfg.lastSync = new Date().toISOString();
    cfg.lastAction = 'upload';
    driveSaveConfig(cfg);

    el.innerHTML = `<div class="ai-panel" style="background:var(--gr50);border-color:var(--gr200);position:relative;">
      <button onclick="this.parentElement.style.display='none'" style="position:absolute;top:8px;right:10px;background:transparent;border:none;font-size:18px;color:var(--gr800);cursor:pointer;line-height:1;padding:4px 8px;" title="Cerrar">×</button>
      <div class="ai-hdr"><div class="ai-dot" style="background:var(--gr600);"></div><span class="ai-ttl" style="color:var(--gr800);">✓ Subida completada</span></div>
      <div class="ai-body" style="color:var(--gr800);">
        <strong>Archivo:</strong> ${DRIVE_FILE_NAME}<br>
        <strong>Tamaño:</strong> ${sizeMB} MB<br>
        <strong>Pacientes:</strong> ${db.patients.length}<br>
        <strong>Documentos:</strong> ${db.documents.length}<br>
        <strong>Consentimientos:</strong> ${(db.consentimientos||[]).length}<br>
        <strong>Médicos:</strong> ${(paquete.medicos||[]).length}<br>
        <strong>Consultorios:</strong> ${(paquete.clinicas||[]).length}<br>
        <strong>Archivos binarios:</strong> ${paquete.archivos.length}
      </div>
    </div>`;
    toast('✓ Datos subidos a Google Drive');
  }catch(e){
    el.innerHTML = `<div class="ai-panel" style="background:var(--r50);border-color:#F09595;"><div class="ai-body" style="color:var(--r800);"><strong>Error al subir:</strong> ${e.message}</div></div>`;

}

// BAJAR de Drive
async function driveBajar(){
  if(!driveAccessToken){ toast('No conectado a Drive'); return; }

  // Primero busca el archivo en Drive para mostrar info en la confirmación
  const el = document.getElementById('drive-result');
  el.innerHTML = `<div class="ai-panel"><div class="ai-hdr"><div class="ai-dot"></div><span class="ai-ttl">Buscando archivo en Drive...</span></div><div class="ai-ldr"><div class="ai-d"></div><div class="ai-d"></div><div class="ai-d"></div></div></div>`;

  let folderId, file;
  try{
    folderId = await driveGetOrCreateFolder();
    file = await driveFindBackupFile(folderId);
  }catch(e){
    el.innerHTML = `<div class="ai-panel" style="background:var(--r50);border-color:#F09595;"><div class="ai-body" style="color:var(--r800);"><strong>Error al buscar en Drive:</strong> ${e.message}</div></div>`;
    return;
  }

  if(!file){
    el.innerHTML = `<div class="ai-panel" style="background:var(--a50);border-color:#EF9F27;"><div class="ai-body" style="color:var(--a800);"><strong>No se encontró respaldo en Drive.</strong><br>Sube primero los datos desde otro dispositivo, o usa "⬆ Subir a Drive" desde aquí para crear el primer respaldo.</div></div>`;
    return;
  }

  // Datos locales actuales
  const totalPtsLocal = db.patients.length;
  const totalDocsLocal = db.documents.length;
  const totalConsLocal = (db.consentimientos||[]).length;
  const totalMedicosLocal = loadMedicos().length;
  const totalClinicasLocal = loadClinicas().length;
  let totalArchivosLocal = 0;
  try{ totalArchivosLocal = (await idbListFiles({})).length; }catch(e){}

  // Info del archivo en Drive
  const sizeMB = file.size ? (parseInt(file.size)/1048576).toFixed(2) : '?';
  const modifiedDate = file.modifiedTime ? new Date(file.modifiedTime).toLocaleString('es-MX') : 'Desconocida';
  const cfg = driveLoadConfig();
  const lastSyncStr = cfg.lastSync ? new Date(cfg.lastSync).toLocaleString('es-MX') : 'Nunca';
  const lastAction = cfg.lastAction === 'upload' ? 'subida' : (cfg.lastAction === 'download' ? 'bajada' : '—');

  // Confirmación con detalles
  let confirmacion = `¿Bajar el respaldo de Google Drive a este dispositivo?\n\n`;
  confirmacion += `═══════════════════════════════\n`;
  confirmacion += `ARCHIVO EN DRIVE:\n`;
  confirmacion += `═══════════════════════════════\n`;
  confirmacion += `• Tamaño: ${sizeMB} MB\n`;
  confirmacion += `• Última modificación en Drive: ${modifiedDate}\n\n`;
  confirmacion += `═══════════════════════════════\n`;
  confirmacion += `DATOS LOCALES ACTUALES (se reemplazan):\n`;
  confirmacion += `═══════════════════════════════\n`;
  confirmacion += `• ${totalPtsLocal} paciente${totalPtsLocal!==1?'s':''}\n`;
  confirmacion += `• ${totalDocsLocal} documento${totalDocsLocal!==1?'s':''} clínico${totalDocsLocal!==1?'s':''}\n`;
  confirmacion += `• ${totalConsLocal} consentimiento${totalConsLocal!==1?'s':''}\n`;
  confirmacion += `• ${totalMedicosLocal} médico${totalMedicosLocal!==1?'s':''} registrado${totalMedicosLocal!==1?'s':''}\n`;
  confirmacion += `• ${totalClinicasLocal} consultorio${totalClinicasLocal!==1?'s':''} registrado${totalClinicasLocal!==1?'s':''}\n`;
  confirmacion += `• ${totalArchivosLocal} archivo${totalArchivosLocal!==1?'s':''} binario${totalArchivosLocal!==1?'s':''}\n\n`;
  confirmacion += `Última sincronización en este dispositivo: ${lastSyncStr} (${lastAction})\n\n`;
  confirmacion += `⚠ Al bajar, TODOS los datos locales serán reemplazados por los de Drive (excepto cuál médico/consultorio tienes marcado como predeterminado, que se queda como está).\n\n`;
  confirmacion += `Si tienes cambios sin sincronizar, cancela y primero sube los datos.`;

  if(!confirm(confirmacion)){
    el.innerHTML = '';
    return;
  }

  el.innerHTML = `<div class="ai-panel"><div class="ai-hdr"><div class="ai-dot"></div><span class="ai-ttl">Descargando ${sizeMB} MB...</span></div><div class="ai-ldr"><div class="ai-d"></div><div class="ai-d"></div><div class="ai-d"></div></div></div>`;

  try{
    const r = await fetch(`https://www.googleapis.com/drive/v3/files/${file.id}?alt=media`, {
      headers:{'Authorization':'Bearer '+driveAccessToken}
    });
    if(!r.ok) throw new Error('No se pudo descargar el archivo');
    const paquete = await r.json();

    if(!paquete.db || !paquete.version){
      throw new Error('El archivo no tiene el formato esperado');
    }

    // Reemplazar localStorage
    db = paquete.db;
    saveDB();

    // Restaurar médicos y consultorios si vienen en el paquete (v1.1+)
    // NO se restaura la selección predeterminada: cada dispositivo elige su propio default
    if(Array.isArray(paquete.medicos)){
      saveMedicos(paquete.medicos);
    }
    if(Array.isArray(paquete.clinicas)){
      saveClinicas(paquete.clinicas);
    }

    // Limpiar IndexedDB y restaurar archivos binarios
    el.innerHTML = `<div class="ai-panel"><div class="ai-hdr"><div class="ai-dot"></div><span class="ai-ttl">Restaurando archivos binarios...</span></div><div class="ai-ldr"><div class="ai-d"></div><div class="ai-d"></div><div class="ai-d"></div></div></div>`;

    // Limpiar IDB existente
    const existentes = await idbListFiles({});
    for(const f of existentes){
      try{ await idbDeleteFile(f.id); }catch(e){}
    }

    // Restaurar archivos del paquete
    let restaurados = 0;
    if(paquete.archivos && paquete.archivos.length){
      const dbConn = await idbOpen();
      for(const a of paquete.archivos){
        try{
          const blob = base64ABlob(a.dataB64, a.type);
          const record = {
            id: a.id,
            name: a.name,
            type: a.type,
            size: a.size,
            blob: blob,
            patientId: a.patientId,
            patientName: a.patientName,
            module: a.module,
            consentTipo: a.consentTipo,
            extractedText: a.extractedText,
            created: a.created
          };
          await new Promise((resolve, reject)=>{
            const tx = dbConn.transaction([IDB_STORE],'readwrite');
            const req = tx.objectStore(IDB_STORE).put(record);
            req.onsuccess = ()=>resolve();
            req.onerror = ()=>reject(req.error);
          });
          restaurados++;
        }catch(e){console.error('Error restaurando archivo:',e);}
      }
    }

    const cfg = driveLoadConfig();
    cfg.lastSync = new Date().toISOString();
    cfg.lastAction = 'download';
    driveSaveConfig(cfg);

    // Resetear paciente actual si ya no existe
    if(currentPatient && !db.patients.find(p=>p.id===currentPatient.id)){
      currentPatient = null;
    }

    el.innerHTML = `<div class="ai-panel" style="background:var(--gr50);border-color:var(--gr200);position:relative;">
      <button onclick="this.parentElement.style.display='none'" style="position:absolute;top:8px;right:10px;background:transparent;border:none;font-size:18px;color:var(--gr800);cursor:pointer;line-height:1;padding:4px 8px;" title="Cerrar">×</button>
      <div class="ai-hdr"><div class="ai-dot" style="background:var(--gr600);"></div><span class="ai-ttl" style="color:var(--gr800);">✓ Datos restaurados desde Drive</span></div>
      <div class="ai-body" style="color:var(--gr800);">
        <strong>Pacientes restaurados:</strong> ${db.patients.length}<br>
        <strong>Documentos:</strong> ${db.documents.length}<br>
        <strong>Consentimientos:</strong> ${(db.consentimientos||[]).length}<br>
        <strong>Médicos:</strong> ${(paquete.medicos||[]).length}<br>
        <strong>Consultorios:</strong> ${(paquete.clinicas||[]).length}<br>
        <strong>Archivos binarios:</strong> ${restaurados}<br>
        <strong>Fecha del respaldo:</strong> ${new Date(paquete.timestamp).toLocaleString('es-MX')}
      </div>
    </div>`;
    toast('✓ Datos restaurados desde Google Drive');
  }catch(e){
    el.innerHTML = `<div class="ai-panel" style="background:var(--r50);border-color:#F09595;"><div class="ai-body" style="color:var(--r800);"><strong>Error al bajar:</strong> ${e.message}</div></div>`;
  }
}

// Genera el HTML completo de la receta con el formato físico exacto
function _generarHTMLRecetaFisica(modoSoloContenido, secciones){
  if(!currentPatient){ toast('Selecciona un paciente'); return null; }

  // Si no se especifican secciones, default = solo medicamentos
  secciones = secciones || {meds:true, ind:false, prox:false, labs:false};

  // Datos del paciente y receta
  const pt = currentPatient;
  const ptName = pt.name || '';
  const ptEdad = pt.dob ? calcAge(pt.dob) + ' años' : '';
  const fecha = gv('rx-fecha') || new Date().toISOString().slice(0,10);
  // Formato fecha legible: dd/mm/yyyy
  let fechaFormateada = fecha;
  if(fecha && /^\d{4}-\d{2}-\d{2}$/.test(fecha)){
    const [y,m,d] = fecha.split('-');
    fechaFormateada = d + '/' + m + '/' + y;
  }
  const dx = gv('rx-dx') || '';

  // Construir el contenido de la prescripción según las secciones seleccionadas
  // Cada bloque tiene su subtítulo en mayúsculas y debajo el contenido
  const bloques = [];
  const medsTexto = (gv('rx-meds') || '').trim();
  const indTexto = (gv('rx-ind') || '').trim();
  const proxTexto = (gv('rx-prox') || '').trim();
  const labsTexto = (gv('rx-labs') || '').trim();

  if(secciones.meds && medsTexto){
    bloques.push({titulo:'MEDICAMENTOS', contenido: medsTexto});
  }
  if(secciones.ind && indTexto){
    bloques.push({titulo:'INDICACIONES GENERALES', contenido: indTexto});
  }
  if(secciones.prox && proxTexto){
    bloques.push({titulo:'PRÓXIMA CITA', contenido: proxTexto});
  }
  if(secciones.labs && labsTexto){
    bloques.push({titulo:'ESTUDIOS A SOLICITAR', contenido: labsTexto});
  }

  // Construir HTML del cuerpo de prescripción SIN subtítulos (para maximizar espacio)
  // Cada bloque seleccionado va seguido del siguiente con una separación moderada
  const prescripcionHtml = bloques.map((b, idx) => {
    const valorEsc = escapeHtml(b.contenido).replace(/\n/g, '<br>');
    return '<div class="rx-bloque"' + (idx > 0 ? ' style="margin-top:0.35cm;"' : '') + '>' +
           '<div class="rx-bloque-contenido">' + valorEsc + '</div>' +
           '</div>';
  }).join('');

  // Próxima cita: si existe contenido, se muestra automáticamente al pie (arriba de los consultorios)
  // En una sola línea: "PRÓXIMA CITA: <contenido>"
  // Independiente del checkbox del modal de impresión
  const proxCitaPieHtml = proxTexto
    ? '<div class="rx-prox-cita">' +
      '<span class="rx-prox-cita-titulo">PRÓXIMA CITA:</span>' +
      '<span>' + escapeHtml(proxTexto.replace(/\n/g, ' ')) + '</span>' +
      '</div>'
    : '';

  // === ESTILO DEL FORMATO ===
  const cssBase = `
    @page { margin: 0; }
    @media print {
      @page { size: auto; margin: 0; }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Helvetica Neue', Arial, sans-serif; color: #145578; background: #fff; }
    .receta-page {
      width: 21.59cm; height: 13.97cm;
      padding: 0.8cm 1cm;
      position: relative;
      overflow: hidden;
      box-sizing: border-box;
    }
    /* ENCABEZADO TRIPARTITO */
    .rx-header {
      display: flex;
      align-items: center;
      gap: 0;
      padding-bottom: 0.3cm;
      margin-bottom: 0.5cm;
    }
    .rx-logo-rg {
      width: 2.4cm;
      height: 2.4cm;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .rx-logo-rg img { max-width: 100%; max-height: 100%; object-fit: contain; }
    .rx-divider-v {
      width: 1px;
      height: 2.2cm;
      background: #7BA8C3;
      margin: 0 0.5cm;
      flex-shrink: 0;
    }
    .rx-medico-info {
      flex: 1;
      text-align: center;
      padding: 0 0.2cm;
    }
    .rx-medico-nombre {
      font-family: 'Allura', 'Great Vibes', 'Pinyon Script', cursive;
      font-size: 26pt;
      color: #488FB4;
      line-height: 1;
      margin-bottom: 0.15cm;
      font-weight: 400;
      white-space: nowrap;
    }
    .rx-medico-esp {
      font-size: 10pt;

// Genera una receta médica pre-llenada desde la nota actual (historia o evolución)
// Toma: paciente actual, diagnóstico (de la nota), plan farmacológico, estudios a solicitar,
// indicaciones generales, próxima cita (si existe en evolución), fecha de hoy.
function generarRecetaDesdeNota(origen){
  if(!currentPatient){ toast('Selecciona un paciente primero'); return; }

  const prefix = origen === 'historia' ? 'hc-' : 'ev-';
  const nombreOrigen = origen === 'historia' ? 'historia clínica' : 'nota de evolución';

  // Recolecto los campos relevantes de la nota actual
  const dxNota = (gv(prefix+'dx') || '').trim();
  const pf = (gv(prefix+'pf') || '').trim();
  const pe = (gv(prefix+'pe') || '').trim();
  const pi = (gv(prefix+'pi') || '').trim();
  // Próxima cita solo existe como campo en evolución
  const prox = origen === 'evolucion' ? (gv('ev-prox') || '').trim() : '';

  // Validar que haya al menos algún contenido relevante para pasar
  if(!pf && !pe && !pi){
    toast(`Llena al menos un campo del plan en la ${nombreOrigen} antes de generar la receta`);
    return;
  }

  // Confirmación si el módulo de receta ya tiene datos capturados (para no sobrescribir sin avisar)
  const recetaActual = {
    dx: (gv('rx-dx') || '').trim(),
    meds: (gv('rx-meds') || '').trim(),
    ind: (gv('rx-ind') || '').trim(),
    prox: (gv('rx-prox') || '').trim(),
    labs: (gv('rx-labs') || '').trim(),
  };
  const hayDatosReceta = recetaActual.dx || recetaActual.meds || recetaActual.ind || recetaActual.prox || recetaActual.labs;
  if(hayDatosReceta){
    if(!confirm(`Ya hay datos capturados en el módulo de receta médica.\n\n¿Quieres sobrescribirlos con el contenido de la ${nombreOrigen}?`)){
      return;
    }
  }

  // Navegar al módulo de receta — esto re-renderiza el formulario
  showView('receta');

  // Esperar a que el formulario esté en el DOM y llenar los campos
  setTimeout(() => {
    // Diagnóstico: usar el de la nota si existe; si no, dejar el del paciente (que ya viene precargado)
    if(dxNota){
      const elDx = document.getElementById('rx-dx');
      if(elDx) elDx.value = dxNota;
    }

    // Plan farmacológico → Medicamentos
    const elMeds = document.getElementById('rx-meds');
    if(elMeds) elMeds.value = pf;

    // Indicaciones generales → Indicaciones generales
    const elInd = document.getElementById('rx-ind');
    if(elInd) elInd.value = pi;

    // Estudios a solicitar → Estudios a solicitar (campo rx-labs)
    const elLabs = document.getElementById('rx-labs');
    if(elLabs) elLabs.value = pe;

    // Próxima cita (solo si viene de evolución)
    if(prox){
      const elProx = document.getElementById('rx-prox');
      if(elProx) elProx.value = prox;
    }

    // Fecha del día de hoy
    const elFecha = document.getElementById('rx-fecha');
    if(elFecha){
      elFecha.value = new Date().toISOString().slice(0,10);
    }

    toast(`Receta pre-llenada desde ${nombreOrigen}. Revisa antes de imprimir.`);
  }, 80);
}

  // Detectar qué campos tienen contenido (para mostrar avisos al usuario)
  const tieneMeds = !!(gv('rx-meds')||'').trim();
  const tieneInd = !!(gv('rx-ind')||'').trim();
  const tieneProx = !!(gv('rx-prox')||'').trim();
  const tieneLabs = !!(gv('rx-labs')||'').trim();

  const checkboxRow = (id, etiqueta, hasContenido, checked) => {
    const aviso = hasContenido ? '' : '<span style="font-size:11px;color:var(--rg-purple-soft);font-style:italic;margin-left:8px;">(vacío)</span>';
    return `
      <label style="display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--p100);border-radius:6px;margin-bottom:6px;cursor:pointer;transition:background 0.15s;" onmouseover="this.style.background='var(--p50)'" onmouseout="this.style.background=''">
        <input type="checkbox" id="${id}" ${checked?'checked':''} style="width:18px;height:18px;cursor:pointer;">
        <span style="font-weight:500;color:var(--rg-purple);">${etiqueta}</span>
        ${aviso}
      </label>
    `;
  };

  const modal = document.createElement('div');
  modal.id = 'rx-secciones-modal';
  modal.className = 'modal-bg';
  modal.style.display = 'flex';
  modal.innerHTML = `
    <div class="modal-card" style="max-width:480px;">
      <div class="modal-head">
        <span class="modal-title">🖨 Imprimir receta</span>
        <button class="modal-x" onclick="document.getElementById('rx-secciones-modal').remove();">×</button>
      </div>
      <p style="font-size:13px;color:var(--rg-purple-mid);margin:0 0 14px;">
        Selecciona qué secciones quieres incluir en la receta impresa:
      </p>

      <div style="margin-bottom:14px;">
        ${checkboxRow('rx-sec-meds','Medicamentos', tieneMeds, true)}
        ${checkboxRow('rx-sec-ind','Indicaciones generales', tieneInd, false)}
        ${checkboxRow('rx-sec-labs','Estudios a solicitar', tieneLabs, false)}
      </div>

      <p style="font-size:11.5px;color:var(--rg-purple-soft);font-style:italic;margin:0 0 14px;">
        Las secciones marcadas pero sin contenido se omiten automáticamente.<br>
        La próxima cita (si está capturada) se imprime automáticamente al pie de la receta.
      </p>

      <div style="display:flex;gap:8px;justify-content:flex-end;">
        <button class="btn" onclick="document.getElementById('rx-secciones-modal').remove();">Cancelar</button>
        <button class="btn btn-primary" onclick="confirmarImpresionReceta()">Imprimir</button>
      </div>
    </div>
  `;

  document.body.appendChild(modal);
}

function confirmarImpresionReceta(){
  const secciones = {
    meds: document.getElementById('rx-sec-meds')?.checked || false,
    ind: document.getElementById('rx-sec-ind')?.checked || false,
    prox: false, // La próxima cita se imprime automáticamente al pie, no aquí
    labs: document.getElementById('rx-sec-labs')?.checked || false,
  };

  // Validar que al menos una sección con contenido esté marcada
  const algunaConContenido =
    (secciones.meds && (gv('rx-meds')||'').trim()) ||
    (secciones.ind && (gv('rx-ind')||'').trim()) ||
    (secciones.labs && (gv('rx-labs')||'').trim());

  if(!algunaConContenido){
    toast('Selecciona al menos una sección que tenga contenido');
    return;
  }

  document.getElementById('rx-secciones-modal').remove();

  const html = _generarHTMLRecetaFisica(false, secciones);
  if(!html) return;
  const w = window.open('', '_blank', 'width=1000,height=750');
  if(!w){ toast('Permite ventanas emergentes para imprimir'); return; }
  w.document.open();
  w.document.write(html);
  w.document.close();
}

// ============= INIT =============
showView('dashboard');
</script>
</body>
</html>
